name: heka_store
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^2.4.4
  intl: ^0.20.2
  get_it: ^9.2.1
  go_router: ^17.1.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  json_annotation: ^4.9.0
  pinput: ^6.0.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3
  hive: ^2.2.3
  http: ^1.6.0
  image_picker: ^1.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_inappwebview: ^6.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Thin.ttf
          weight: 100
        - asset: assets/fonts/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
flutter_intl:
  enabled: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/letter_logo_en_adaptive.png"
  adaptive_icon_background: "#FAF8F5"
  adaptive_icon_foreground: "assets/images/letter_logo_en_adaptive.png"
  min_sdk_android: 21


flutter_native_splash:
  color: "#FAF8F5"
  color_dark: "#181818"
  android_12:
    color: "#FAF8F5"
    color_dark: "#181818"
  fullscreen: true