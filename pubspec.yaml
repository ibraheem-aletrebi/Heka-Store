name: heka_store
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^2.4.4
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

fonts:
  - family: Alexandria
    fonts:
      - asset: assets/fonts/Alexandria-Thin.ttf
        weight: 100
      - asset: assets/fonts/Alexandria-Light.ttf
        weight: 300
      - asset: assets/fonts/Alexandria-Regular.ttf
        weight: 400
      - asset: assets/fonts/Alexandria-Medium.ttf
        weight: 500
      - asset: assets/fonts/Alexandria-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Alexandria-Bold.ttf
        weight: 700
flutter_intl:
  enabled: true
